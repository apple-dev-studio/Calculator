name: macOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build for macOS
      run: |
        xcodebuild -project Calculator.xcodeproj -scheme Calculator -destination 'platform=macOS' clean build
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
