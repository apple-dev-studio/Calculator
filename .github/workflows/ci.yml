name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby for CocoaPods
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods dependencies
      run: |
        gem install cocoapods
        pod install || echo "No Podfile found"

    - name: Build and test
      run: |
        xcodebuild -workspace Calculator.xcworkspace -scheme Calculator -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14' clean test | xcpretty
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
