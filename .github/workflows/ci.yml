name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build (no tests)
      run: |
        xcodebuild -project Calculator.xcodeproj -scheme Calculator -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14' clean build
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
